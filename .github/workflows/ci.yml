name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting (Prettier)
        run: npm run format:check

      - name: Verify TypeScript types
        run: npm run typecheck

      - name: Run automated tests & coverage (Vitest)
        run: npm run test:coverage

      - name: Commit updated coverage badge
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain .github/badges)" ]; then
            git add .github/badges
            git commit -m "chore: update test coverage badge [skip ci]"
            git push
          fi

      - name: Build and package extension
        run: npm run package

      - name: Upload extension build artifact
        uses: actions/upload-artifact@v4
        with:
          name: export-to-pdf-for-chatgpt-build
          path: dist/export-to-pdf-for-chatgpt.zip
          retention-days: 14
