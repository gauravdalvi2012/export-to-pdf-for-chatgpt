name: Bug Report
description: Report an issue or rendering problem with ChatGPT conversation export
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify you are running the latest version from the Chrome Web Store or `main` branch before submitting.

  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: e.g. Google Chrome 131.0.6778.86 (Official Build) (64-bit)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. macOS Sonoma, Ubuntu 24.04, Windows 11
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
      placeholder: e.g. Code block formatting in Bash scripts is missing indentation in the PDF...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Specific steps to reproduce the behavior.
      placeholder: |
        1. Open ChatGPT conversation with...
        2. Click extension icon
        3. Observe print preview
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Browser Console Output (if applicable)
      description: Please paste any console errors from Chrome DevTools (F12 -> Console).
      render: shell
