name: Feature Request
description: Suggest an idea or enhancement for Export to PDF for ChatGPT
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
      placeholder: e.g. When printing long conversations with multiple attachments...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
      placeholder: e.g. Add an option in the Settings UI to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
